<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario Empleados</title>
    <style>
      .tabla { border-collapse: collapse; width: 100%; max-width: 720px; margin: 0 auto; }
      .tabla th, .tabla td { border: 1px solid #000; padding: 6px; text-align: left; }
      .boton { padding: 6px 12px; }
      .centrar { text-align: center; }
      .hint { font-size:0.9em; color:#555; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="text-align:center;">Formulario Empleados</h1>
      <form name="empleados" class="formulario" action="informacion.php" method="POST" autocomplete="on">
        <table class="tabla" role="table">
          <tr>
            <th scope="row"><label for="Identificacion">Identificación empleado</label></th>
            <td><input id="Identificacion" type="text" name="Identificacion" required autocomplete="off" placeholder="Documento o ID"></td>
          </tr>
          <tr>
            <th scope="row"><label for="NomApellidos">Nombres y apellidos</label></th>
            <td><input id="NomApellidos" type="text" name="NomApellidos" required autocomplete="name" placeholder="Ej. Juan Pérez"></td>
          </tr>
          <tr>
            <th scope="row"><label for="Cargo">Cargo a desempeñar</label></th>
            <td><input id="Cargo" type="text" name="Cargo" required autocomplete="organization-title" placeholder="Ej. Analista"></td>
          </tr>
          <tr>
            <th scope="row"><label for="Salario">Salario (COP)</label></th>
            <td>
              <!-- Se acepta cualquier valor en pesos colombianos. Permitimos separadores (puntos/comas) y símbolos; antes de enviar se normaliza a solo dígitos. -->
              <input id="Salario" type="text" name="Salario" required placeholder="Ej. 1.500.000 o 1500000" inputmode="numeric" pattern="^[0-9.,\s$]+$" aria-label="Salario bruto en pesos colombianos (COP)">
              <div class="hint">Ingrese el monto en pesos colombianos. Puede usar puntos o comas como separador de miles. Ejemplos válidos: 1500000, 1.500.000, $1.500.000</div>
            </td>
          </tr>
          <tr>
            <td colspan="2" class="centrar">
              <input type="submit" value="Enviar Datos" class="boton">
            </td>
          </tr>
        </table>
      </form>
    </main>

    <script>
      // Antes de enviar el formulario, normalizamos el campo Salario a solo dígitos
      // para que el backend reciba un número en pesos (sin separadores ni símbolos).
      (function() {
        var form = document.querySelector('form[name="empleados"]');
        var salario = document.getElementById('Salario');
        if (!form || !salario) return;
        form.addEventListener('submit', function(e) {
          // Extraer solo dígitos
          var raw = salario.value || '';
          var digits = raw.replace(/[^0-9]/g, '');
          // Si quedó vacío o no hay dígitos, evitar el envío y notificar al usuario
          if (digits.length === 0) {
            e.preventDefault();
            alert('Por favor ingrese un valor de salario válido en pesos colombianos.');
            salario.focus();
            return false;
          }
          // Reemplazar el valor por la versión normalizada
          salario.value = digits;
          return true;
        });
      })();
    </script>
  </body>
</html>
