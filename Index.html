<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario Empleados</title>
    <style>
      /* Estilos básicos, reemplazan el uso de border en la tabla */
      .tabla { border-collapse: collapse; }
      .tabla td, .tabla th { border: 1px solid #000; padding: 6px; }
      .boton { padding: 6px 12px; }
    </style>
  </head>

  <body>
    <form name="empleados" class="formulario" action="informacion.php" method="POST" novalidate>
      <table class="tabla">
        <tr>
          <td><label for="Identificacion">Identificación empleado</label></td>
          <td><input id="Identificacion" type="text" name="Identificacion" required></td>
        </tr>
        <tr>
          <td><label for="NomApellidos">Nombres y apellidos</label></td>
          <td><input id="NomApellidos" type="text" name="NomApellidos" required></td>
        </tr>
        <tr>
          <td><label for="Cargo">Cargo a desempeñar</label></td>
          <td><input id="Cargo" type="text" name="Cargo" required></td>
        </tr>
        <tr>
          <td><label for="Salario">Salario</label></td>
          <td><input id="Salario" type="number" name="Salario" min="0" step="0.01" required></td>
        </tr>
        <tr>
          <td colspan="2" style="text-align:center;">
            <input type="submit" value="Enviar Datos" class="boton">
          </td>
        </tr>
      </table>
    </form>
  </body>
  </html>
